<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="__SHORT__">
__ICON_TAG__
<meta name="description" content="__DESC__">
<meta name="theme-color" content="#0f5c58">
<title>__TITLE__</title>
<style>
:root{
  --blue-deep:#0b3b38; --blue:#0f5c58; --blue-mid:#127a72; --blue-bright:#1aa596;
  --blue-soft:#e8f5f3; --blue-line:#c6e6e1;
  --blue-grad:linear-gradient(135deg,#0b3b38 0%,#0f5c58 50%,#14a090 100%);
  --ink:#15151a; --sub:#4a4a54; --mut:#767680; --line:#e8e8ee; --soft:#f7f8fa;
  --gold-deep:#8a5a00; --gold-soft:#fdf5e0; --gold-line:#f2e2b5;
  --red:#a03030; --red-soft:#fdeaea; --red-line:#e0a8a8;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--soft);overflow:hidden}
html,body,button,a,label{touch-action:manipulation}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  color:var(--ink);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;font-feature-settings:"palt" 1}
button,select{font:inherit}

/* ══ 1画面：上バー／カード（中だけスクロール）／下の操作バー ══ */
.app{position:fixed;inset:0;display:flex;flex-direction:column;height:100dvh}
.top{flex:none;background:var(--blue-grad);color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.top-row{display:flex;align-items:center;justify-content:center;gap:10px;min-height:44px}
.top .ttl{font-size:14px;font-weight:700;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .cnt{font-size:12.5px;opacity:.85;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:4px;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:#fff;width:0;transition:width .3s ease}

.main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
.col{max-width:720px;margin:0 auto;padding:14px max(14px,env(safe-area-inset-left,0px)) 20px}

.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.card>h4{margin:0;padding:9px 16px;background:var(--soft);border-bottom:1px solid var(--line);
  font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--blue)}
.card>h4 span{font-weight:600;color:var(--mut);margin-left:8px;letter-spacing:0}
.card.lesson>h4{background:var(--blue-grad);color:#fff;border-bottom:0}
.card.lesson>h4 span{color:#fff;opacity:.85}
.card-body{padding:14px 16px 16px}

.stem{font-size:15.5px;line-height:1.85;margin:0 0 12px;white-space:pre-line}
.stem-tbl-w{overflow-x:auto;margin:6px 0 10px;-webkit-overflow-scrolling:touch}
.stem-tbl{border-collapse:collapse;font-size:13.5px;line-height:1.5;white-space:normal;min-width:100%}
.stem-tbl th,.stem-tbl td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.stem-tbl th{background:#eef6f5;font-weight:700;white-space:nowrap}
.stem-tbl td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.stem-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.6;white-space:pre;overflow-x:auto;background:#f6f8fa;border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin:6px 0 10px}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.opt{width:100%;display:flex;gap:10px;align-items:flex-start;text-align:left;font-size:14.5px;line-height:1.7;
  color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer;
  transition:border-color .15s ease,background .15s ease}
.opt:hover{border-color:var(--blue-line)}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;background:var(--soft);color:var(--sub);
  font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
.opt .t{flex:1;min-width:0}
.opt .tag{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:800;border-radius:999px;padding:0 8px;vertical-align:1px}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--blue);background:var(--blue-soft)}
.opt.ok .k,.opt.ok .tag{background:var(--blue);color:#fff}
.opt.ng{border-color:var(--red-line);background:var(--red-soft)}
.opt.ng .k,.opt.ng .tag{background:var(--red);color:#fff}
.opt.trap .tag{background:var(--gold-soft);color:var(--gold-deep);border:1px solid var(--gold-line)}
.opt.dim{opacity:.55}
.opt.sel{border-color:var(--blue-bright);background:#eef9f7}
.opt.sel .k{background:var(--blue-bright);color:#fff}
.multi-b{display:inline-block;font-size:12px;font-weight:800;color:var(--blue);background:var(--blue-soft);border:1px solid var(--blue-line);border-radius:999px;padding:1px 10px;margin:0 0 10px}
.scn{margin:0 0 14px;border:1px solid var(--blue-line);border-radius:12px;background:#f6fbfa}
.scn summary{cursor:pointer;padding:8px 14px;font-size:12.5px;font-weight:700;color:var(--blue);list-style:none}
.scn summary::-webkit-details-marker{display:none}
.scn summary::before{content:"▸ ";}
.scn[open] summary::before{content:"▾ ";}
.scn p{margin:0;padding:0 14px 12px;font-size:13.5px;line-height:1.8;color:var(--sub)}
.mock-seg{margin-top:8px}
.mock-seg[hidden]{display:none}
.sp-box[hidden]{display:none}
.sp-list{list-style:none;margin:6px 0 14px;padding:0;display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.sp-list button{width:100%;text-align:left;font-size:13px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;line-height:1.5}
.sp-list button.on{border-color:var(--blue-mid);box-shadow:inset 0 0 0 1px var(--blue-mid)}
.sp-list button small{display:block;color:var(--mut);font-size:11.5px}
.sp-list button.done small{color:#1a6b38;font-weight:700}
.sp-acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.sp-acts button{font-size:14px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
.sp-acts button.go{background:var(--blue-grad);color:#fff;border:0;font-weight:700}
.dom-b{display:inline-block;font-size:11.5px;color:var(--blue-deep);background:var(--blue-soft);border-radius:99px;padding:1px 9px;margin:0 0 8px}
.mock-r{margin:10px 0 0;padding:0;list-style:none}
.mock-r li{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0;font-size:14px}

.exp{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.verdict{font-weight:800;font-size:15px;margin:0 0 4px}
.verdict.good{color:var(--blue)}
.verdict.bad{color:var(--red)}
.exp h5{margin:12px 0 2px;font-size:11.5px;letter-spacing:.08em;color:var(--mut);font-weight:800}
.exp p{margin:0;font-size:14.5px;line-height:1.8;color:var(--sub)}

.d-lead{font-size:15.5px;line-height:1.8;font-weight:700;color:var(--blue-deep);margin:0 0 12px}
.pts{display:grid;gap:10px}
.pt b{display:block;font-size:13px;color:var(--blue-deep)}
.pt p{margin:0;font-size:14px;color:var(--sub);line-height:1.75}
.pt.key b{color:var(--gold-deep)}

.done-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 12px}
.done-grid div{background:var(--soft);border-radius:12px;padding:10px 12px}
.done-grid b{display:block;font-size:21px;color:var(--blue-deep);font-variant-numeric:tabular-nums}
.done-grid span{font-size:11.5px;color:var(--mut)}
.card-body p{margin:8px 0}

/* ══ 下の操作バー ══ */
.nav{flex:none;background:#fff;border-top:1px solid var(--line);
  padding:10px max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.nav-in{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:center}
.nav button{border-radius:12px;padding:12px 14px;font-size:14px;font-weight:700;cursor:pointer;
  border:1px solid var(--line);background:#fff;color:var(--sub);min-height:46px}
.nav button.go{flex:1;background:var(--blue-grad);color:#fff;border:0}
.nav button:disabled{opacity:.4;cursor:default}
.nav .menu-b{padding:12px 13px}

/* ══ メニュー（下から出るシート） ══ */
.sheet-bg{position:fixed;inset:0;background:rgba(10,12,30,.35);z-index:10;opacity:0;pointer-events:none;transition:opacity .2s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:#fff;border-radius:18px 18px 0 0;
  max-height:86dvh;overflow-y:auto;overscroll-behavior:contain;transform:translateY(100%);transition:transform .25s ease;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.open .sheet-bg{opacity:1;pointer-events:auto}
.open .sheet{transform:none}
.sheet-in{max-width:720px;margin:0 auto}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 12px}
.sheet h6{margin:14px 0 6px;font-size:11.5px;letter-spacing:.1em;color:var(--mut);font-weight:800}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button,.sheet select,.sheet .danger{width:100%;border:1px solid var(--line);background:#fff;color:var(--sub);
  border-radius:12px;padding:11px 12px;font-size:14px;cursor:pointer}
.seg button.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue);font-weight:700}
.sheet .danger{margin-top:8px;color:var(--red)}
.sync{font-size:12px;color:var(--mut);margin:10px 0 0}
.sync.err{color:var(--gold-deep)}
.stat{width:100%;border-collapse:collapse;font-size:13px}
.stat td{padding:7px 4px;border-top:1px solid var(--line);vertical-align:top}
.stat tr:first-child td{border-top:0}
.stat td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--sub)}
.stat tr.weak td:first-child{color:var(--red);font-weight:700}
.stat .h td{font-size:11px;color:var(--mut);font-weight:700}
.note{font-size:11.5px;color:var(--mut);margin:12px 0 0;line-height:1.6}

/* ══ 図（figHTML） ══ */
.fig{margin:14px 0 4px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px}
.fig-cap{font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--blue);margin:0 0 10px}
.fb{background:#fff;border:1px solid var(--blue-line);border-radius:10px;padding:8px 10px;min-width:0}
.fb b{display:block;font-size:13px;line-height:1.5;color:var(--blue-deep)}
.fb small{display:block;font-size:12px;line-height:1.55;color:var(--sub);margin-top:2px}
.fb.ok{border-color:var(--blue);background:var(--blue-soft)}
.fb.ng{border-color:var(--red-line);background:var(--red-soft)}
.fb.ng b{color:var(--red)}
.fb.key{border-color:var(--gold-line);background:var(--gold-soft)}
.fb.key b{color:var(--gold-deep)}
.fl{display:flex;flex-direction:column;align-items:stretch}
.ar{align-self:center;color:var(--blue-mid);font-size:15px;line-height:1;padding:4px 0;font-weight:800}
.ar::before{content:"↓"}
@media (min-width:640px){
  .fl.h{flex-direction:row;align-items:stretch}
  .fl.h>.fb{flex:1}
  .fl.h>.ar{padding:0 5px}
  .fl.h>.ar::before{content:"→"}
}
.fork{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px}
.fork-ar{text-align:center;color:var(--blue-mid);font-weight:800;font-size:13px;padding:4px 0}
.back{margin-top:8px;font-size:12px;color:var(--blue-mid);font-weight:700;text-align:center;
  border:1px dashed var(--blue-line);border-radius:999px;padding:4px 10px;background:#fff}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vs>div{border-radius:10px;padding:8px 10px;border:1px solid}
.vs .n{background:var(--red-soft);border-color:var(--red-line)}
.vs .o{background:var(--blue-soft);border-color:var(--blue)}
.vs h6{margin:0 0 4px;font-size:12px;font-weight:800;line-height:1.45}
.vs .n h6{color:var(--red)} .vs .o h6{color:var(--blue)}
.vs ul{margin:0;padding-left:1.1em;font-size:12.5px;line-height:1.6;color:var(--sub)}
.vs li+li{margin-top:3px}
@media (max-width:380px){ .vs{grid-template-columns:1fr} }
.lay{display:grid;gap:6px}
.lay .fb{display:grid;grid-template-columns:minmax(6.5em,34%) 1fr;gap:8px;align-items:baseline}
.lay .fb small{margin:0}
.hub-top{max-width:420px;margin:0 auto;width:100%}
.hub-kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:6px}
.mx{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;line-height:1.5;background:#fff;
  border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mx th,.mx td{padding:6px 7px;border-top:1px solid var(--line);vertical-align:top;text-align:left}
.mx tr:first-child th{border-top:0;background:var(--blue-soft);color:var(--blue-deep);font-size:11.5px}
.mx td:first-child{font-weight:700;color:var(--ink)}
.mx td{color:var(--sub)}
.mx .y{color:var(--blue);font-weight:700} .mx .x{color:var(--red)} .mx .m{color:var(--gold-deep)}
.bars{display:grid;gap:7px}
.bar-r b{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink);font-weight:700}
.bar-r b span{color:var(--sub);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar-r i{display:block;height:10px;border-radius:6px;background:var(--blue-mid);margin-top:3px}
.bar-r.ng i{background:var(--red)} .bar-r.key i{background:#d49a1c} .bar-r.ok i{background:var(--blue)}
.bar-r small{display:block;font-size:11.5px;color:var(--mut);margin-top:2px}

.rest{margin:4px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.rest li{font-size:14px;line-height:1.75;color:var(--sub);display:flex;gap:8px}
.rest li b{flex:none;width:22px;height:22px;border-radius:50%;background:var(--soft);color:var(--sub);
  font-size:11.5px;display:flex;align-items:center;justify-content:center;margin-top:3px}
.exp .deep{background:var(--soft);border-radius:12px;padding:10px 12px;margin-top:4px}

</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="top-row"><span class="ttl">__SHORT__</span><span class="cnt" id="cnt"></span></div>
    <div class="bar"><i id="barFill"></i></div>
  </header>
  <main class="main" id="main"><div class="col" id="stage"></div></main>
  <nav class="nav"><div class="nav-in">
    <button type="button" class="menu-b" id="menuB" aria-label="メニュー">成績・設定</button>
    <button type="button" id="prev">前へ</button>
    <button type="button" class="go" id="next">次へ</button>
  </div></nav>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="成績と設定"><div class="sheet-in">
  <div class="grab"></div>
  <div class="sp-box" id="spBox" hidden>
    <h6>10問ずつの周回（押すと、最初から・続きから・間違えた問題だけを選べる）</h6>
    <ul class="sp-list" id="spList"></ul>
  </div>
  <h6>解き方</h6>
  <div class="seg">
    <button type="button" data-mode="all">全問を通しで解く</button>
    <button type="button" data-mode="wrong">間違えた問題だけ</button>
  </div>
  <div class="seg mock-seg" id="mockSeg" hidden>
    <button type="button" data-mode="mock" id="mockB">本番形式で解く</button>
  </div>
  <h6>分野へ移動</h6>
  <select id="jump" aria-label="分野へ移動"></select>
  <h6 id="statHead">分野別の成績</h6>
  <table class="stat"><tbody id="statBody"></tbody></table>
  <p class="sync" id="sync">　</p>
  <button type="button" class="danger" id="reset">記録を消して最初からやり直す</button>
  <p class="note">__NOTE__</p>
</div></div>

<script id="drill-data" type="application/json">__DATA__</script>
<script>
(function(){
  var D = JSON.parse(document.getElementById('drill-data').textContent);
  // 記録はブラウザの localStorage に保存する。build(sync=...) で保存APIを渡したときだけ、
  // そのAPIへ GET / PUT して端末間で同期する（ブラウザだけのときは、ブラウザごとに別の記録になる）
  var SHARE = !D.sync;
  var LKEY = D.key + '-v1';
  var API = D.sync ? D.sync.url : null;
  var SYNC_HEADERS = (D.sync && D.sync.headers) || {};
  var LET = ['A','B','C','D','E'];
  var MOCK = D.mock || null;
  var SP = D.spiral || null;
  function isMulti(c){ return Array.isArray(c.ans); }
  function hasAns(c, o){ return isMulti(c) ? c.ans.indexOf(o) >= 0 : c.ans === o; }
  var sel = {};
  var SCN_KEY = 'drill-scn-open';
  var scnOpen = (function(){ try { var v = localStorage.getItem(SCN_KEY); if (v !== null) return v === '1'; } catch(e) {} return window.matchMedia('(min-width: 700px)').matches; })();
  var secById = {}; D.sections.forEach(function(s,i){ s.no = i+1; secById[s.id] = s; });
  var cardById = {}; D.cards.forEach(function(c){ cardById[c.id] = c; });
  var qCards = D.cards.filter(function(c){ return c.type === 'q'; });

  function blank(){ return {v:1, mode:'all', cur:D.cards[0].id, answers:{}, wrongDeck:[], pass:{}, touched:0, resetAt:0, mockSecs:[], mockAt:0, round:0, roundAt:{}, spInit:0, fix:null}; }
  var S = blank();
  try { var raw = localStorage.getItem(LKEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch(e) {}

  // 問題文：2字下げの行のかたまりを、列が2つ以上そろえば表（1行目が見出し）、そろわなければ等幅のコード枠にする
  function stemHTML(s){
    var out = [], buf = [], blk = [];
    function flushText(){ if (buf.length) { out.push(esc(buf.join('\n'))); buf = []; } }
    function flushBlk(){
      if (!blk.length) return;
      var rows = blk.map(function(l){ return l.trim().split(/\s{2,}/); });
      var n = rows[0].length;
      if (rows.length >= 2 && n >= 2 && rows.every(function(r){ return r.length === n; })) {
        out.push('<div class="stem-tbl-w"><table class="stem-tbl"><tr>' + rows[0].map(function(c){ return '<th>' + esc(c) + '</th>'; }).join('') + '</tr>' +
          rows.slice(1).map(function(r){ return '<tr>' + r.map(function(c){ return '<td' + (/^[\d.,%]+$/.test(c) ? ' class="n"' : '') + '>' + esc(c) + '</td>'; }).join('') + '</tr>'; }).join('') +
          '</table></div>');
      } else {
        out.push('<div class="stem-code">' + esc(blk.map(function(l){ return l.slice(2); }).join('\n')) + '</div>');
      }
      blk = [];
    }
    String(s).split('\n').forEach(function(l){
      if (/^  \S|^   /.test(l)) { flushText(); blk.push(l); } else { flushBlk(); buf.push(l); }
    });
    flushText(); flushBlk();
    return out.join('');
  }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  // ── 端末とサーバーの統合：解答は問題ごとに新しいほう、現在地は最後に触った端末のもの
  function merge(a, b){
    var newer = (a.touched||0) >= (b.touched||0) ? a : b;
    var out = Object.assign(blank(), newer, {answers:{}});
    var ids = {}; Object.keys(a.answers||{}).concat(Object.keys(b.answers||{})).forEach(function(k){ ids[k]=1; });
    Object.keys(ids).forEach(function(k){
      var x = (a.answers||{})[k], y = (b.answers||{})[k];
      out.answers[k] = !x ? y : !y ? x : ((x.at||0) >= (y.at||0) ? x : y);
    });
    // どちらかの端末で「やり直す」を押していたら、それより前の解答は捨てる
    out.resetAt = Math.max(a.resetAt||0, b.resetAt||0);
    Object.keys(out.answers).forEach(function(k){ if ((out.answers[k].at||0) < out.resetAt) delete out.answers[k]; });
    // 周の解き直しの起点は、周ごとに新しいほうを採る。後から触った端末の古い起点で上書きすると、
    // 解き直し中の周に前回の解答が「選んだ状態」で戻ってくる
    out.roundAt = {};
    [a.roundAt||{}, b.roundAt||{}].forEach(function(m){ Object.keys(m).forEach(function(r){ out.roundAt[r] = Math.max(out.roundAt[r]||0, m[r]||0); }); });
    return out;
  }

  var syncEl = document.getElementById('sync');

  function hhmm(){ var d=new Date(); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }

  var online = true, pushTimer = null, dirty = false, busy = false;
  function saveLocal(){ try { localStorage.setItem(LKEY, JSON.stringify(S)); } catch(e) {} }
  function touch(){ S.touched = Date.now(); saveLocal(); dirty = true; clearTimeout(pushTimer); pushTimer = setTimeout(push, 700); }


  function pull(){
    if (SHARE) return Promise.resolve(null);
    return fetch(API, {credentials:'same-origin', cache:'no-store'}).then(function(r){
      if (r.status === 401) { online = false; syncMsg('保存先にログインしていないため、この端末にだけ保存中', true); return null; }
      if (!r.ok) throw new Error(r.status);
      online = true; return r.json();
    });
  }
  function push(){
    if (!online || busy) return;
    busy = true;
    pull().then(function(remote){
      if (!remote) return;
      if (remote.state) S = merge(S, remote.state);
      saveLocal();
      var body = JSON.stringify({state:S});
      return fetch(API, {method:'PUT', credentials:'same-origin', headers:Object.assign({'content-type':'application/json'}, SYNC_HEADERS), body:body}).then(function(r){ if (!r.ok) throw new Error(r.status); dirty = false; syncMsg('サーバーに保存済み（' + hhmm() + '）'); });
    }).catch(function(e){ syncMsg('サーバーへ保存できず、端末に一時保存中（' + (e && e.message || '通信エラー') + '）。つながったら自動で送る', true); })
      .then(function(){ busy = false; });
  }
  function refresh(){
    if (SHARE) { syncMsg('記録はこのブラウザにだけ保存しています。別の端末やブラウザで開くと、最初からになります'); return; }
    pull().then(function(remote){
      if (!remote) return;
      var before = S.cur;
      if (remote.state) S = merge(S, remote.state);
      saveLocal(); render(before !== S.cur);
      if (dirty || !remote.state) push(); else syncMsg('サーバーと同期済み（' + hhmm() + '）');

      '<div class="stem">' + stemHTML(c.stem) + '</div>' + (isMulti(c) && !a ? '<span class="multi-b">' + c.ans.length + 'つ選ぶ（選択中 ' + (sel[c.id]||[]).length + '）</span>' : '') +

  function mockDoneHTML(){
    var dk = deck(), ok = 0, ans = 0, per = {};

      var a = S.answers[c.id], r = per[c.sec] || (per[c.sec] = {ok:0, n:0}); r.n++;

  function roundStat(r){

  }
  // その周で、いちばん新しい解答が不正解の問題

  var barFill = document.getElementById('barFill'), cnt = document.getElementById('cnt');

  function renderStats(){
    renderSpiral();
    var all = stats();
    document.getElementById('statHead').textContent = '分野別の成績（解答 ' + all.answered + '/' + qCards.length + '・最新 ' + pct(all.ok, all.answered) + '・初回 ' + pct(all.first, all.answered) + '）';
    var RL = !!D.rateLabel;
    document.getElementById('statBody').innerHTML = '<tr class="h"><td>分野</td>' + (RL ? '<td class="n">' + esc(D.rateLabel) + '</td>' : '') + '<td class="n">解答</td><td class="n">最新</td><td class="n">初回</td></tr>' +
      D.sections.map(function(s){
        var st = stats(s.id), weak = st.answered && st.ok/st.answered < 0.6;
        return '<tr' + (weak ? ' class="weak"' : '') + '><td>' + esc(s.title) + '</td>' + (RL ? '<td class="n">' + esc(s.rate) + '</td>' : '') + '<td class="n">' + st.answered + '/' + st.n + '</td><td class="n">' + pct(st.ok, st.answered) + '</td><td class="n">' + pct(st.first, st.answered) + '</td></tr>';
      }).join('');
  }

  function go(delta){
    var dk = deck(), i = curIndex(dk) + delta;
    if (i < 0) return;
    S.cur = i >= dk.length ? '__done' : dk[i].id;
    touch(); render(true);
  }
  function answer(orig){
    var dk = deck(), c = dk[curIndex(dk)];
    if (!c || c.type !== 'q' || revealed(c)) return;
    if (isMulti(c)) {
      var cur = (sel[c.id] || []).slice(), at = cur.indexOf(orig);
      if (at >= 0) cur.splice(at, 1); else cur.push(orig);
      sel[c.id] = cur;
      if (cur.length < c.ans.length) { render(false); return; }
      delete sel[c.id];
      orig = cur.slice().sort();
    }
    var prev = S.answers[c.id];
    var ok = isMulti(c) ? orig.length === c.ans.length && orig.every(function(o){ return c.ans.indexOf(o) >= 0; }) : orig === c.ans;
    S.answers[c.id] = {c:orig, ok:ok, at:Date.now(), tries:(prev ? (prev.tries||1) : 0) + 1, first: prev ? prev.first : ok};
    if (S.mode === 'wrong') S.pass[c.id] = 1;
    touch(); render(false);
    var exp = document.getElementById('exp');
    if (exp) main.scrollTo({top: Math.max(0, exp.offsetTop - main.clientHeight * 0.35), behavior: 'smooth'});
  }

  function startRound(r, redo){
    S.mode = 'spiral'; S.round = r; S.fix = null; sel = {};
    if (redo) { S.roundAt = Object.assign({}, S.roundAt); S.roundAt[r] = Date.now(); }
    var at = (S.roundAt||{})[r]||0;
    var open = SP.rounds[r].filter(function(id){ var a = S.answers[id]; return !a || (a.at||0) < at; })[0];
    S.cur = open || '__done'; touch(); render(true);
  }
  // 周の中で間違えた問題だけを、未解答の状態から解き直す。終わるたびに残りの不正解でもう一度回せる
  function startFix(r){
    var ids = roundMiss(r);
    if (!ids.length) { startRound(r, false); return; }
    S.mode = 'spfix'; S.round = r; S.fix = {r:r, ids:ids, at:Date.now()}; sel = {};
    S.cur = ids[0]; touch(); render(true);
  }
  stage.addEventListener('click', function(e){
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.getAttribute('data-act');
    if (act === 'next-round') startRound(S.round + 1, false);
    else if (act === 'redo-round') startRound(S.round, true);
    else if (act === 'fix-round') startFix(S.round);
    else if (act === 'resume-round') startRound(S.round, false);
  });
  document.getElementById('spList').addEventListener('click', function(e){
    var b = e.target.closest('[data-round]'); if (!b) return;
    S.mode = 'spiral'; S.round = Number(b.getAttribute('data-round')); S.fix = null; sel = {}; S.cur = '__intro';
    touch(); render(true); openSheet(false);
  });
  stage.addEventListener('toggle', function(e){
    if (!e.target.classList || !e.target.classList.contains('scn')) return;
    scnOpen = e.target.open; try { localStorage.setItem(SCN_KEY, scnOpen ? '1' : '0'); } catch(err) {}
  }, true);
  stage.addEventListener('click', function(e){
    var b = e.target.closest('.opt'); if (b && !b.disabled) answer(Number(b.getAttribute('data-o')));
  });
  prevB.addEventListener('click', function(){ go(-1); });
  nextB.addEventListener('click', function(){ go(1); });

  // ── メニュー
  var app = document.body;
  function openSheet(v){ app.classList.toggle('open', v); }
  document.getElementById('menuB').addEventListener('click', function(){ openSheet(true); });
  document.getElementById('sheetBg').addEventListener('click', function(){ openSheet(false); });

  document.querySelectorAll('[data-mode]').forEach(function(b){
    b.addEventListener('click', function(){
      var m = b.getAttribute('data-mode');
      if (m === 'wrong') {
        var wrongSecs = {}, ids = [];
        qCards.forEach(function(c){ var a=S.answers[c.id]; if (a && !a.ok) wrongSecs[c.sec] = 1; });
        D.cards.forEach(function(c){
          var a = S.answers[c.id];
          if (c.type === 'lesson' ? wrongSecs[c.sec] : (a && !a.ok)) ids.push(c.id);
        });
        S.wrongDeck = ids; S.pass = {}; S.cur = ids[0] || '__done';
      } else if (m === 'mock') {
        var pool = D.sections.filter(function(s){ return s.n >= MOCK.per; }).map(function(s){ return s.id; });
        for (var i = pool.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp; }
        var pick = pool.slice(0, MOCK.scenarios);
        S.mockSecs = D.sections.map(function(s){ return s.id; }).filter(function(id){ return pick.indexOf(id) >= 0; });
        S.mockAt = Date.now();
        var first = qCards.filter(function(c){ return S.mockSecs.indexOf(c.sec) >= 0; })[0];
        S.cur = first ? first.id : '__done';
      } else if (S.mode !== 'all') {
        var firstOpen = qCards.filter(function(c){ return !S.answers[c.id]; })[0];
        S.cur = firstOpen ? firstOpen.id : '__done';
      }
      S.mode = m; touch(); render(true); openSheet(false);
    });
  });
  var jump = document.getElementById('jump');
  jump.innerHTML = '<option value="">分野を選ぶ</option>' + D.sections.map(function(s){ return '<option value="' + s.id + '">' + s.no + '. ' + esc(s.title) + '</option>'; }).join('');
  jump.addEventListener('change', function(){
    if (!jump.value) return;
    var first = D.cards.filter(function(c){ return c.sec === jump.value; })[0];
    S.mode = 'all'; S.cur = first ? first.id : 'L-' + jump.value; jump.value = ''; touch(); render(true); openSheet(false);
  });
  document.getElementById('reset').addEventListener('click', function(){
    if (!confirm('すべての解答記録を消して、最初から解き直しますか？' + (SHARE ? '' : '（ほかの端末にも反映されます）'))) return;
    S = Object.assign(blank(), {resetAt: Date.now()}); touch(); render(true); openSheet(false);
  });

  document.addEventListener('keydown', function(e){
    if (e.target.closest && e.target.closest('input,select,textarea')) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k === 'Escape') { openSheet(false); return; }
    if (/^[1-5]$/.test(k) || /^[a-eA-E]$/.test(k)) {
      var dk = deck(), c = dk[curIndex(dk)]; if (!c || c.type !== 'q') return;
      var i = /^[1-5]$/.test(k) ? Number(k)-1 : 'abcde'.indexOf(k.toLowerCase());
      if (i >= c.order.length) return;
      answer(c.order[i]); e.preventDefault();
    } else if (k === 'ArrowRight' || k === 'Enter') { if (!nextB.disabled) { go(1); e.preventDefault(); } }
    else if (k === 'ArrowLeft') { if (!prevB.disabled) { go(-1); e.preventDefault(); } }
  });

  var sx = null, sy = null;
  main.addEventListener('touchstart', function(e){ var t=e.touches[0]; sx=t.clientX; sy=t.clientY; }, {passive:true});
  main.addEventListener('touchend', function(e){
    if (sx === null) return; var t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy; sx=null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8) { if (dx < 0 && !nextB.disabled) go(1); else if (dx > 0 && !prevB.disabled) go(-1); }
  }, {passive:true});

  if (MOCK) { var mb = document.getElementById('mockB'); mb.textContent = '本番形式（' + MOCK.scenarios * MOCK.per + '問）'; document.getElementById('mockSeg').hidden = false; }
  if (S.mode === 'mock' && !MOCK) S.mode = 'all';
  if (SP) {
    document.getElementById('spBox').hidden = false;
    // 周回を初めて使う問題集は、解答の有無にかかわらず第1周の入口から始める（途中まで解いた記録は残る）
    if (!S.spInit) { S.spInit = 1; S.mode = 'spiral'; S.round = 0; S.fix = null; S.cur = Object.keys(S.answers).length ? '__intro' : SP.rounds[0][0]; touch(); }
    if (S.round >= SP.rounds.length) S.round = 0;
    if (S.mode === 'spfix' && !(S.fix && S.fix.ids && S.fix.ids.length)) S.mode = 'spiral';
  } else if (S.mode === 'spiral' || S.mode === 'spfix') S.mode = 'all';
  render(true);
  refresh();
})();
</script>
</body>
</html>
